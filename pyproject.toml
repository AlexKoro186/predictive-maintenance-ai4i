[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance-ai4i"
version = "0.1.0"
description = "Machine failure prediction using the AI4I 2020 predictive maintenance dataset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "ucimlrepo>=0.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"